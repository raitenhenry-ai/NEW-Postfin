<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choose your plan — Postfin</title>
    <link rel="icon" href="assets/logo-white.png?v=2" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "SF Pro Display",
          "SF Pro Text",
          "Helvetica Neue",
          Helvetica,
          Arial,
          sans-serif;
        background: #ffffff;
        color: #111114;
        overflow-x: hidden;
      }

      .wallpaper {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background: linear-gradient(
          to bottom,
          #5a9fe0 0%,
          #8ec0ef 28%,
          #c5dff7 55%,
          #eaf4fc 78%,
          #ffffff 100%
        );
      }

      .shell {
        position: relative;
        z-index: 1;
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 28px 0 72px;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }

      .top {
        display: flex;
        align-items: center;
        margin-bottom: 28px;
      }

      .top a {
        display: inline-flex;
        text-decoration: none;
      }

      .top img {
        width: 40px;
        height: 40px;
        object-fit: contain;
      }

      .paywall {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        text-align: center;
      }

      h1 {
        font-size: clamp(1.7rem, 3.4vw, 2.2rem);
        font-weight: 650;
        letter-spacing: -0.035em;
        margin: 0 0 8px;
      }

      .lead {
        margin: 0 auto 36px;
        max-width: 38ch;
        font-size: 1rem;
        line-height: 1.45;
        color: rgba(17, 17, 20, 0.55);
        letter-spacing: -0.015em;
      }

      .plans {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
        align-items: stretch;
        width: 100%;
        max-width: 1040px;
        margin: 0 auto;
      }

      .plan-card {
        appearance: none;
        position: relative;
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.85);
        background: #ffffff;
        border-radius: 28px;
        padding: 28px 26px 26px;
        text-align: left;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        font: inherit;
        color: inherit;
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 1) inset,
          0 0 0 1px rgba(15, 23, 42, 0.04),
          0 2px 4px rgba(20, 40, 70, 0.06),
          0 12px 24px rgba(20, 40, 70, 0.1),
          0 28px 48px rgba(20, 40, 70, 0.14),
          0 48px 80px rgba(20, 40, 70, 0.16),
          0 72px 120px rgba(20, 40, 70, 0.12);
        transition:
          transform 0.18s ease,
          box-shadow 0.18s ease;
      }

      .plan-card::after {
        content: "";
        position: absolute;
        left: 12%;
        right: 12%;
        bottom: -18px;
        height: 28px;
        border-radius: 50%;
        background: rgba(20, 40, 70, 0.22);
        filter: blur(18px);
        z-index: -1;
        pointer-events: none;
        transition: opacity 0.18s ease, transform 0.18s ease;
      }

      .plan-card:hover {
        transform: translateY(-6px);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 1) inset,
          0 0 0 1px rgba(15, 23, 42, 0.05),
          0 4px 8px rgba(20, 40, 70, 0.08),
          0 18px 32px rgba(20, 40, 70, 0.12),
          0 36px 60px rgba(20, 40, 70, 0.16),
          0 60px 100px rgba(20, 40, 70, 0.18),
          0 90px 140px rgba(20, 40, 70, 0.14);
      }

      .plan-card:hover::after {
        opacity: 0.85;
        transform: translateY(8px) scaleX(1.04);
      }

      .plan-card.is-featured {
        z-index: 1;
        transform: translateY(-10px);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 1) inset,
          0 0 0 1px rgba(15, 23, 42, 0.06),
          0 4px 10px rgba(20, 40, 70, 0.1),
          0 20px 36px rgba(20, 40, 70, 0.14),
          0 40px 70px rgba(20, 40, 70, 0.18),
          0 70px 110px rgba(20, 40, 70, 0.2),
          0 100px 160px rgba(20, 40, 70, 0.16);
      }

      .plan-card.is-featured::after {
        left: 8%;
        right: 8%;
        bottom: -22px;
        height: 34px;
        background: rgba(20, 40, 70, 0.28);
        filter: blur(22px);
      }

      .plan-card.is-featured:hover {
        transform: translateY(-14px);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 1) inset,
          0 0 0 1px rgba(15, 23, 42, 0.06),
          0 6px 12px rgba(20, 40, 70, 0.12),
          0 24px 42px rgba(20, 40, 70, 0.16),
          0 48px 80px rgba(20, 40, 70, 0.2),
          0 80px 130px rgba(20, 40, 70, 0.22),
          0 120px 180px rgba(20, 40, 70, 0.18);
      }

      .plan-name {
        display: block;
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: -0.03em;
        color: #111114;
        margin-bottom: 10px;
      }

      .plan-price {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 18px;
        color: #111114;
      }

      .plan-price strong {
        font-size: clamp(2.2rem, 3.4vw, 2.75rem);
        font-weight: 750;
        letter-spacing: -0.05em;
        line-height: 1;
      }

      .plan-price span {
        font-size: 1rem;
        font-weight: 500;
        color: rgba(17, 17, 20, 0.45);
        letter-spacing: -0.02em;
      }

      .plan-cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 48px;
        margin-bottom: 14px;
        padding: 0 18px;
        border-radius: 14px;
        background: #1a1a1e;
        color: #fff;
        font-size: 0.98rem;
        font-weight: 650;
        letter-spacing: -0.02em;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
      }

      .plan-card:hover .plan-cta {
        background: #000;
      }

      .plan-desc {
        display: block;
        margin-bottom: 18px;
        font-size: 0.92rem;
        font-weight: 500;
        color: rgba(17, 17, 20, 0.5);
        letter-spacing: -0.015em;
        line-height: 1.4;
      }

      .plan-card hr {
        width: 100%;
        border: none;
        border-top: 1px solid #ececf1;
        margin: 0 0 16px;
      }

      .plan-includes {
        display: block;
        margin-bottom: 12px;
        font-size: 0.92rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #111114;
      }

      .plan-card ul {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 11px;
        margin: 0;
      }

      .plan-card li {
        display: grid;
        grid-template-columns: 18px minmax(0, 1fr);
        gap: 10px;
        align-items: start;
        font-size: 0.92rem;
        font-weight: 500;
        color: #3a3a42;
        letter-spacing: -0.015em;
        line-height: 1.4;
      }

      .plan-card li svg {
        width: 16px;
        height: 16px;
        margin-top: 2px;
        color: #7eb6f0;
        flex-shrink: 0;
      }

      .plan-back {
        display: inline-flex;
        margin: 28px auto 0;
        padding: 10px 14px;
        border: none;
        background: none;
        color: rgba(17, 17, 20, 0.48);
        font: inherit;
        font-size: 0.95rem;
        font-weight: 500;
        cursor: pointer;
        text-decoration: none;
      }

      .plan-back:hover {
        color: #111114;
      }

      @media (max-width: 900px) {
        .shell {
          width: min(440px, calc(100% - 24px));
        }

        .plans {
          grid-template-columns: 1fr;
          max-width: 400px;
        }

        .plan-card.is-featured {
          order: -1;
          transform: none;
        }

        .plan-card.is-featured:hover {
          transform: translateY(-4px);
        }
      }
    </style>
  </head>
  <body>
    <div class="wallpaper" aria-hidden="true"></div>
    <div class="shell">
      <div class="top">
        <a href="index.html" aria-label="Back to Postfin">
          <img src="assets/logo-white.png?v=2" alt="Postfin" />
        </a>
      </div>

      <main class="paywall">
        <h1>Choose your plan</h1>
        <p class="lead">Pick the plan that fits your brand — cancel anytime.</p>

        <div class="plans" role="radiogroup" aria-label="Plans">
          <button type="button" class="plan-card" role="radio" aria-checked="false" data-plan="starter" data-price="19">
            <span class="plan-name">Starter</span>
            <span class="plan-price"><strong>$19</strong><span>/ month</span></span>
            <span class="plan-cta">Subscribe</span>
            <span class="plan-desc">Great for getting started with slideshows.</span>
            <hr />
            <span class="plan-includes">Includes</span>
            <ul>
              <li><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.2L6.2 11.2L13 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>AI slideshow generation</li>
              <li><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.2L6.2 11.2L13 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Core brand templates</li>
              <li><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.2L6.2 11.2L13 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Schedule to your platforms</li>
              <li><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.2L6.2 11.2L13 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Caption rewriting</li>
              <li><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.2L6.2 11.2L13 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Basic analytics</li>
            </ul>
          </button>

          <button type="button" class="plan-card is-featured" role="radio" aria-checked="false" data-plan="growth" data-price="49">
            <span class="plan-name">Growth</span>
            <span class="plan-price"><strong>$49</strong><span>/ month</span></span>
            <span class="plan-cta">Subscribe</span>
            <span class="plan-desc">For brands posting consistently.</span>
            <hr />
            <span class="plan-includes">Everything in Starter, plus...</span>
            <ul>
              <li><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.2L6.2 11.2L13 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Higher slideshow volume</li>
              <li><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.2L6.2 11.2L13 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>More connected accounts</li>
              <li><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.2L6.2 11.2L13 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Priority generation</li>
              <li><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.2L6.2 11.2L13 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Advanced brand templates</li>
              <li><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.2L6.2 11.2L13 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Deeper performance insights</li>
            </ul>
          </button>

          <button type="button" class="plan-card" role="radio" aria-checked="false" data-plan="scale" data-price="199">
            <span class="plan-name">Scale</span>
            <span class="plan-price"><strong>$199</strong><span>/ month</span></span>
            <span class="plan-cta">Subscribe</span>
            <span class="plan-desc">Full autopilot with video included.</span>
            <hr />
            <span class="plan-includes">Everything in Growth, plus...</span>
            <ul>
              <li><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.2L6.2 11.2L13 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>AI video generation</li>
              <li><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.2L6.2 11.2L13 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>HeyGen avatar videos</li>
              <li><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.2L6.2 11.2L13 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Multi-brand workspaces</li>
              <li><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.2L6.2 11.2L13 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Priority support</li>
              <li><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.2L6.2 11.2L13 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Custom brand voice</li>
              <li><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.2L6.2 11.2L13 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Dedicated generation capacity</li>
            </ul>
          </button>
        </div>

        <a class="plan-back" href="onboard.html">Back</a>
      </main>
    </div>

    <script>
      (function () {
        const DRAFT_KEY = "postfin_onboard_draft";
        const FINAL_KEY = "postfin_onboard";
        const cards = [...document.querySelectorAll("[data-plan]")];

        function readDraft() {
          try {
            return JSON.parse(localStorage.getItem(DRAFT_KEY) || "{}") || {};
          } catch (_) {
            return {};
          }
        }

        cards.forEach((btn) => {
          btn.addEventListener("click", () => {
            cards.forEach((b) => {
              b.classList.remove("is-selected");
              b.setAttribute("aria-checked", "false");
            });
            btn.classList.add("is-selected");
            btn.setAttribute("aria-checked", "true");

            const draft = readDraft();
            const payload = {
              ...draft,
              plan: btn.dataset.plan,
              planPrice: btn.dataset.price,
              at: new Date().toISOString(),
            };
            try {
              localStorage.setItem(FINAL_KEY, JSON.stringify(payload));
              localStorage.removeItem(DRAFT_KEY);
            } catch (_) {}
            window.location.href = "dashboard.html";
          });
        });
      })();
    </script>
  </body>
</html>
