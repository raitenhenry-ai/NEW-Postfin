<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (() => {
      try {
        if (localStorage.getItem("pf-theme") === "light") {
          document.documentElement.classList.add("theme-light");
        }
      } catch (_) {}
    })();
  </script>
  <title>Calendar</title>
  <link rel="icon" href="logo.png?v=2">
  <link rel="stylesheet" href="styles.css?v=141">
</head>
<body>
  <script>
    (() => {
      if (document.documentElement.classList.contains("theme-light")) {
        document.body.classList.add("theme-light");
      }
    })();
  </script>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <button class="logo-btn" type="button" aria-label="Expand sidebar" aria-expanded="false" id="logo-btn">
        <img class="logo-default" src="logo.png?v=2" alt="">
        <img class="logo-hover" src="logo-hover.png?v=2" alt="">
      </button>
      <div class="top-actions">
        <button class="top-icon-btn" type="button" aria-label="Collapse sidebar" id="collapse-btn">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="3.5" stroke="currentColor" stroke-width="1.75"/>
            <path d="M9 4v16" stroke="currentColor" stroke-width="1.75"/>
            <path d="M16.5 12H12m0 0l2-2m-2 2l2 2" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="divider"></div>
    <nav class="sidebar-nav" aria-label="Main">
      <a class="nav-btn" href="dashboard.html" aria-label="Dash">
        <span class="nav-box">
          <span class="home-icon" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
          <span class="nav-label">Dash</span>
        </span>
      </a>
      <a class="nav-btn active" href="calendar.html" aria-label="Calendar" aria-current="page">
        <span class="nav-box">
          <svg class="ads-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3.5" y="5" width="17" height="15.5" rx="2.5" stroke="currentColor" stroke-width="1.75"/>
            <path d="M3.5 10h17M8 3.5v3M16 3.5v3" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
          </svg>
          <span class="nav-label">Calendar</span>
        </span>
      </a>
      <a class="nav-btn" href="products.html" aria-label="Products">
        <span class="nav-box">
          <svg class="ads-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 8.5L12 4l8 4.5v7L12 20l-8-4.5v-7z" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
            <path d="M12 12v8M4 8.5l8 3.5 8-3.5" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
          </svg>
          <span class="nav-label">Products</span>
        </span>
      </a>
      <a class="nav-btn" href="analytics.html" aria-label="Analytics">
        <span class="nav-box">
          <svg class="ads-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4.5 19.5v-5.5M10 19.5V8M15.5 19.5v-9M21 19.5V4.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
          </svg>
          <span class="nav-label">Analytics</span>
        </span>
      </a>
      <a class="nav-btn" href="recent.html" aria-label="Recent">
        <span class="nav-box">
          <svg class="ads-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="8.25" stroke="currentColor" stroke-width="1.75"/>
            <path d="M12 8v4.5l3 1.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="nav-label">Recent</span>
        </span>
      </a>
      <a class="nav-btn" href="connectors.html" aria-label="Connectors">
        <span class="nav-box">
          <svg class="ads-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M8.5 15.5l7-7" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
            <path d="M10.2 6.8l1.3-1.3a3.2 3.2 0 1 1 4.5 4.5l-1.3 1.3M13.8 17.2l-1.3 1.3a3.2 3.2 0 1 1-4.5-4.5l1.3-1.3" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="nav-label">Connectors</span>
        </span>
      </a>
    </nav>
    <div class="sidebar-foot">
      <div class="divider"></div>
      <a class="profile" href="profile.html" aria-label="cole perrilliat">
        <span class="profile-avatar">C</span>
        <span class="profile-name">cole perrilliat</span>
        <svg class="profile-chevron" viewBox="0 0 12 12" fill="none" aria-hidden="true">
          <path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
    </div>
  </aside>

  <main class="page cal-workspace">
    <div class="cal-shell">
      <header class="cal-topbar">
          <div class="cal-topbar-left">
            <h1>Calendar</h1>

            <div class="cal-mode-switcher" id="cal-mode-switcher">
              <button type="button" class="cal-mode-switcher-btn" id="cal-mode-switcher-btn" aria-haspopup="menu" aria-expanded="false" aria-label="Plan mode">
                <span class="cal-mode-switcher-icon" id="cal-mode-switcher-icon" aria-hidden="true">
                  <svg viewBox="0 0 16 16" fill="none"><path d="M1.5 8s2.5-4.5 6.5-4.5S14.5 8 14.5 8s-2.5 4.5-6.5 4.5S1.5 8 1.5 8z" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.4"/></svg>
                </span>
                <span class="cal-mode-switcher-label" id="cal-mode-switcher-label">View</span>
                <svg class="cal-mode-switcher-caret" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <div class="cal-mode-menu" id="cal-mode-menu" role="menu" hidden>
                <button type="button" class="cal-mode-menu-item" role="menuitemradio" data-cal-mode="view" aria-checked="true">
                  <span class="cal-mode-check" aria-hidden="true">
                    <svg viewBox="0 0 12 12" fill="none"><path d="M2.5 6.2L4.8 8.5L9.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  </span>
                  <span class="cal-mode-menu-icon" aria-hidden="true">
                    <svg viewBox="0 0 16 16" fill="none"><path d="M1.5 8s2.5-4.5 6.5-4.5S14.5 8 14.5 8s-2.5 4.5-6.5 4.5S1.5 8 1.5 8z" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.4"/></svg>
                  </span>
                  <span>View</span>
                </button>
                <button type="button" class="cal-mode-menu-item" role="menuitemradio" data-cal-mode="edit" aria-checked="false">
                  <span class="cal-mode-check" aria-hidden="true">
                    <svg viewBox="0 0 12 12" fill="none"><path d="M2.5 6.2L4.8 8.5L9.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  </span>
                  <span class="cal-mode-menu-icon" aria-hidden="true">
                    <svg viewBox="0 0 16 16" fill="none"><path d="M9.2 3.2l3.6 3.6M3 13l1.1-3.9L11.4 1.8a1.3 1.3 0 0 1 1.8 0l1 1a1.3 1.3 0 0 1 0 1.8L6.9 11.9 3 13z" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/></svg>
                  </span>
                  <span>Edit</span>
                </button>
              </div>
            </div>
          </div>

          <div class="cal-month-nav" id="cal-month-nav">
            <button type="button" class="cal-icon-btn" id="cal-prev" aria-label="Previous month">
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3.5L5.5 8 10 12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>

            <div class="cal-month-picker" id="cal-month-picker">
              <button type="button" class="cal-month-label" id="cal-month-label" aria-haspopup="dialog" aria-expanded="false">
                <span id="cal-month-text">June 2026</span>
                <svg viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <div class="cal-month-menu" id="cal-month-menu" hidden>
                <div class="cal-month-menu-year">
                  <button type="button" class="cal-icon-btn" id="cal-year-prev" aria-label="Previous year">
                    <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3.5L5.5 8 10 12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  </button>
                  <span id="cal-year-text">2026</span>
                  <button type="button" class="cal-icon-btn" id="cal-year-next" aria-label="Next year">
                    <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3.5L10.5 8 6 12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  </button>
                </div>
                <div class="cal-month-menu-grid" id="cal-month-menu-grid" role="listbox" aria-label="Select month"></div>
              </div>
            </div>

            <button type="button" class="cal-icon-btn" id="cal-next" aria-label="Next month">
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3.5L10.5 8 6 12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>

          <div class="cal-topbar-right">
            <script>
              (function () {
                try {
                  var mode = localStorage.getItem("cal-mode");
                  if (mode === "agent") {
                    localStorage.setItem("cal-mode", "view");
                    mode = "view";
                  }
                  if (mode !== "view" && mode !== "edit") return;
                  var label = document.getElementById("cal-mode-switcher-label");
                  var icon = document.getElementById("cal-mode-switcher-icon");
                  if (label) label.textContent = mode === "edit" ? "Edit" : "View";
                  if (icon) {
                    icon.innerHTML = mode === "edit"
                      ? '<svg viewBox="0 0 16 16" fill="none"><path d="M9.2 3.2l3.6 3.6M3 13l1.1-3.9L11.4 1.8a1.3 1.3 0 0 1 1.8 0l1 1a1.3 1.3 0 0 1 0 1.8L6.9 11.9 3 13z" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/></svg>'
                      : '<svg viewBox="0 0 16 16" fill="none"><path d="M1.5 8s2.5-4.5 6.5-4.5S14.5 8 14.5 8s-2.5 4.5-6.5 4.5S1.5 8 1.5 8z" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.4"/></svg>';
                  }
                  document.querySelectorAll("#cal-mode-menu [data-cal-mode]").forEach(function (btn) {
                    btn.setAttribute("aria-checked", btn.getAttribute("data-cal-mode") === mode ? "true" : "false");
                  });
                  var viewTool = document.getElementById("cal-view-tool");
                  var chatTool = document.getElementById("cal-chat-toggle");
                  if (viewTool) {
                    viewTool.classList.toggle("is-on", mode === "view");
                    viewTool.setAttribute("aria-pressed", mode === "view" ? "true" : "false");
                  }
                  if (chatTool) {
                    chatTool.classList.toggle("is-on", mode === "edit");
                    chatTool.setAttribute("aria-pressed", mode === "edit" ? "true" : "false");
                  }
                } catch (e) {}
              })();
            </script>
            <div class="cal-history-picker" id="cal-history-picker">
              <button type="button" class="cal-tool-btn" id="cal-history-btn" aria-label="Recent chats" aria-haspopup="menu" aria-expanded="false" title="Recent chats">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <circle class="cal-tool-icon" cx="12" cy="12" r="8.25"/>
                  <path class="cal-tool-icon" d="M12 8v4.5l3 1.5"/>
                </svg>
              </button>
              <div class="cal-history-menu" id="cal-history-menu" role="menu" hidden>
                <div class="cal-history-menu-head">Recent chats</div>
                <div class="cal-history-menu-list" id="cal-history-list"></div>
              </div>
            </div>
            <button type="button" class="cal-tool-btn" id="cal-view-tool" data-cal-mode="view" aria-label="View mode" aria-pressed="false" title="View">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path class="cal-tool-icon" d="M2.5 12s3.4-5.75 9.5-5.75S21.5 12 21.5 12s-3.4 5.75-9.5 5.75S2.5 12 2.5 12z"/>
                <circle class="cal-tool-icon-pupil" cx="12" cy="12" r="2.6"/>
              </svg>
            </button>
            <button type="button" class="cal-tool-btn" id="cal-chat-toggle" data-cal-mode="edit" aria-label="Edit mode" aria-pressed="false" title="Edit">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path class="cal-tool-icon" d="M4.75 5.5h14.5A2.25 2.25 0 0 1 21.5 7.75v6.5a2.25 2.25 0 0 1-2.25 2.25h-5.35l-3.85 2.9a.7.7 0 0 1-1.12-.56v-2.34H4.75A2.25 2.25 0 0 1 2.5 14.25v-6.5A2.25 2.25 0 0 1 4.75 5.5z"/>
              </svg>
            </button>
          </div>
      </header>

      <div class="cal-body">
        <section class="cal-main" aria-label="Content calendar">
          <div class="cal-board" id="cal-board">
            <div class="cal-weekdays" aria-hidden="true">
              <span>SUN</span><span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span>
            </div>
            <div class="cal-grid" id="cal-grid" role="grid" aria-label="June 2026"></div>
            <div class="cal-day-popup" id="cal-day-popup" hidden>
              <div class="cal-day-popup-chrome" id="cal-day-popup-drag">
                <button type="button" class="cal-day-popup-close" id="cal-day-popup-close" aria-label="Close">
                  <svg viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M3 3l6 6M9 3L3 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                </button>
              </div>
              <div class="cal-day-popup-head">
                <div class="cal-day-popup-time-picker" id="cal-day-popup-time-picker">
                  <button type="button" class="cal-month-label cal-day-popup-time" id="cal-day-popup-time-btn" aria-haspopup="listbox" aria-expanded="false">
                    <span id="cal-day-popup-count"></span>
                    <svg viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  </button>
                  <div class="cal-day-popup-time-menu" id="cal-day-popup-time-menu" role="listbox" aria-label="Select time" hidden></div>
                </div>
                <div class="cal-day-popup-heading">
                  <strong id="cal-day-popup-date"></strong>
                </div>
                <div class="cal-day-popup-head-actions">
                  <div class="cal-day-popup-mode" role="tablist" aria-label="Edit or view">
                    <button type="button" class="is-on" data-popup-mode="edit">Edit</button>
                    <button type="button" data-popup-mode="view">View</button>
                  </div>
                </div>
              </div>
              <div class="cal-day-popup-list" id="cal-day-popup-list"></div>
              <span class="cal-day-popup-resize is-e" data-popup-resize="e" aria-label="Resize width"></span>
              <span class="cal-day-popup-resize is-s" data-popup-resize="s" aria-label="Resize height"></span>
              <span class="cal-day-popup-resize is-se" data-popup-resize="se" aria-label="Resize">
                <svg viewBox="0 0 12 12" fill="none" aria-hidden="true">
                  <path d="M7 11h4M9 9h2M11 7v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
              </span>
            </div>
          </div>

          <p class="cal-hint" id="cal-hint">View mode · browse your schedule</p>
        </section>

        <button type="button" class="cal-chat-cancel" id="cal-chat-cancel" hidden>New chat</button>
        <aside class="cal-chat" aria-label="Day posts" id="cal-chat">
          <div class="cal-chat-header">
            <div class="cal-chat-header-text">
              <h2 id="cal-chat-title">Day posts</h2>
              <span class="cal-chat-sub" id="cal-selection-label">Loading…</span>
            </div>
          </div>
          <div class="cal-chat-messages" id="cal-chat-messages"></div>
          <div class="cal-chat-tools" id="cal-chat-tools">
            <div class="cal-product-pill" id="cal-product-picker">
              <button type="button" class="cal-product-pill-btn" id="cal-product-pill-btn" aria-haspopup="listbox" aria-expanded="false">
                <span class="cal-product-pill-label" id="cal-product-pill-label">Link product</span>
                <svg class="cal-product-pill-caret" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <div class="cal-product-menu" id="cal-product-menu" role="listbox" hidden></div>
            </div>
            <div class="cal-format-picker" id="cal-format-picker">
              <button type="button" class="cal-format-btn" id="cal-format-btn" aria-haspopup="menu" aria-expanded="false" aria-label="Output format" title="Output format">
                <span class="cal-format-btn-icon" id="cal-format-btn-icon" aria-hidden="true"></span>
              </button>
              <div class="cal-format-menu" id="cal-format-menu" role="menu" hidden>
                <button type="button" class="cal-format-menu-item" role="menuitemradio" data-format="slideshow" aria-checked="false">
                  <span class="cal-format-menu-icon" aria-hidden="true">
                    <svg viewBox="0 0 16 16" fill="none"><rect x="2.5" y="3.5" width="11" height="9" rx="1.5" stroke="currentColor" stroke-width="1.4"/><circle cx="5.75" cy="6.5" r="1" fill="currentColor"/><path d="M2.75 10.5l2.8-2.4 2.1 1.7 2.4-2.6 3.2 3.3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  </span>
                  <span class="cal-format-menu-copy">
                    <strong>Slideshow</strong>
                    <em>Slideshow generation</em>
                  </span>
                </button>
                <button type="button" class="cal-format-menu-item" role="menuitemradio" data-format="video" aria-checked="true">
                  <span class="cal-format-menu-icon" aria-hidden="true">
                    <svg viewBox="0 0 16 16" fill="none"><rect x="2.5" y="3.5" width="11" height="9" rx="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M7 6.2v3.6L10.2 8 7 6.2z" fill="currentColor"/></svg>
                  </span>
                  <span class="cal-format-menu-copy">
                    <strong>Video</strong>
                    <em>Video generation</em>
                  </span>
                </button>
              </div>
            </div>
            <div class="cal-platform-picker" id="cal-platform-picker">
              <button type="button" class="cal-product-pill-btn" id="cal-platform-btn" aria-haspopup="menu" aria-expanded="false" aria-label="Target platform">
                <span class="cal-product-pill-label" id="cal-platform-label">All platforms</span>
                <svg class="cal-product-pill-caret" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <div class="cal-platform-menu" id="cal-platform-menu" role="menu" hidden></div>
            </div>
          </div>
          <form class="cal-composer" id="cal-chat-form">
            <div class="cal-composer-chips" id="cal-date-chips" hidden></div>
            <div class="cal-composer-chips cal-attach-chips" id="cal-attach-chips" hidden></div>
            <textarea id="cal-chat-field" rows="3" placeholder="Ask for videos, or anything about your posts" autocomplete="off"></textarea>
            <div class="cal-composer-toolbar">
              <button type="button" class="cal-composer-plus" id="cal-composer-plus" aria-label="Attach an image">+</button>
              <input type="file" id="cal-attach-input" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
              <div class="cal-composer-actions">
                <button type="submit" class="cal-composer-send" id="cal-chat-send" aria-label="Send" disabled>
                  <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 12.5V3.5M8 3.5L4.5 7M8 3.5L11.5 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
              </div>
            </div>
          </form>
        </aside>
      </div>
    </div>
  </main>

  <script src="api.js?v=43"></script>
  <script src="app.js?v=44"></script>
  <script src="calendar.js?v=129"></script>
</body>
</html>
